name: LinkVault packages

on:
  push:
    branches: [v4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'

jobs:
  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libxkbcommon-x11-0 libxcb-cursor0 xvfb xauth
      - name: Build
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - name: Package and test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          mkdir -p tools artifacts AppDir/usr/share/doc/linkvault
          for tool in linuxdeploy linuxdeploy-plugin-qt; do
            bin="$tool-x86_64.AppImage"
            curl -fLsS --retry 3 "https://github.com/linuxdeploy/$tool/releases/download/continuous/$bin" -o "tools/$bin"
            chmod +x "tools/$bin"
          done
          icon=io.github.manixpcshot.linkvault
          cp icon.png "tools/$icon.png"
          cp THIRD-PARTY-NOTICES.md AppDir/usr/share/doc/linkvault/
          export PATH="$PWD/tools:$PATH" QMAKE="$QT_ROOT_DIR/bin/qmake"
          export OUTPUT=LinkVault-4.0.0-linux-x86_64.AppImage
          linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/LinkVault \
            --desktop-file "packaging/linux/$icon.desktop" --icon-file "tools/$icon.png" \
            --plugin qt --output appimage
          mv "$OUTPUT" artifacts/
          unset QT_PLUGIN_PATH LD_LIBRARY_PATH
          status=0
          xvfb-run -a timeout 8s "artifacts/$OUTPUT" || status=$?
          test "$status" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVault-Linux-AppImage
          path: artifacts/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS universal DMG
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          archives: qtbase qtsvg
          cache: true
      - name: Build and package
        run: |
          qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          cmake --build build --parallel
          lipo build/LinkVault.app/Contents/MacOS/LinkVault -verify_arch arm64 x86_64
          cp THIRD-PARTY-NOTICES.md build/LinkVault.app/Contents/Resources/
          macdeployqt build/LinkVault.app -dmg -always-overwrite
          app_dmg="$(find . -maxdepth 2 -name LinkVault.dmg -print -quit)"
          test -n "$app_dmg"
          mkdir -p artifacts
          mv "$app_dmg" artifacts/LinkVault-4.0.0-macos-universal.dmg
          hdiutil verify artifacts/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVault-macOS-DMG
          path: artifacts/*.dmg
          if-no-files-found: error

  android:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          cache: true
      - name: Install Android build tools
        run: sdkmanager 'ndk;26.1.10909125' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify APK
        run: |
          qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_ANDROID_DEPLOYMENT_TYPE=Debug \
            -DQT_HOST_PATH="$QT_HOST_PATH" -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125" -DANDROID_PLATFORM=android-28 \
            -DQT_ANDROID_TARGET_SDK_VERSION=35 -DQT_ANDROID_SDK_BUILD_TOOLS_REVISION=35.0.0
          cmake --build build --parallel --target apk
          apk="$(find build -name '*.apk' -path '*/outputs/apk/*' -print -quit)"
          test -n "$apk"
          mkdir -p artifacts
          cp "$apk" artifacts/LinkVault-4.0.0-android-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify artifacts/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/*.apk | tee apk-info.txt
          grep -F "package: name='io.github.manixpcshot.linkvault'" apk-info.txt
          grep -F "native-code: 'arm64-v8a'" apk-info.txt
          grep -F "uses-permission: name='android.permission.INTERNET'" apk-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVault-Android-APK
          path: artifacts/*.apk
          if-no-files-found: error

  ios:
    name: iOS arm64, unsigned
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: ios
          arch: ios
          archives: qtbase qtsvg
          cache: true
      - name: Build unsigned device bundle
        run: |
          qt-cmake -S . -B build -G Xcode -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64
          xcodebuild -project build/LinkVault.xcodeproj -scheme LinkVault -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app="$(find build -type d -name LinkVault.app -print -quit)"
          test -n "$app"
          lipo "$app/LinkVault" -verify_arch arm64
          plutil -lint "$app/Info.plist"
          cp THIRD-PARTY-NOTICES.md "$app/"
          mkdir -p artifacts
          ditto -c -k --keepParent "$app" artifacts/LinkVault-4.0.0-ios-arm64-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVault-iOS-Unsigned
          path: artifacts/*.zip
          if-no-files-found: error
